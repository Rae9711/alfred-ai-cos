name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly integration run (see the `integration` job) at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: albert
          POSTGRES_PASSWORD: albert
          POSTGRES_DB: albert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albert"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://albert:albert@localhost:5432/albert
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      # Valid Fernet key so crypto imports succeed; not a real secret.
      TOKEN_ENCRYPTION_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      # TODO(baseline): ruff + mypy currently report pre-existing failures on files that
      # predate the newer, stricter locked toolchain. These steps are advisory
      # (continue-on-error) so CI signals the debt without blocking every PR. Do NOT
      # rely on this to hide errors in NEW code — fix those before merge. Once the
      # baseline is cleaned up, drop continue-on-error to make these hard gates again.
      - name: Lint (ruff)
        continue-on-error: true
        run: uv run ruff check app tests
      - name: Format check (ruff format)
        continue-on-error: true
        run: uv run ruff format --check app tests
      - name: Type-check (mypy strict)
        continue-on-error: true
        run: uv run mypy app
      # Unit/functional tests only. Integration tests (external sandboxes) are excluded
      # here and run in the secrets-guarded `integration` job below.
      - name: Test (pytest, unit)
        run: uv run pytest -m "not integration"
      - name: Migrations apply + app boots
        run: |
          uv run alembic upgrade head
          uv run python -c "from app.main import app; assert app.openapi()"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Type-check shared-types
        run: bunx tsc --noEmit
        working-directory: packages/shared-types
      - name: Type-check mobile
        run: bunx tsc --noEmit
        working-directory: mobile

  integration:
    # External-sandbox tests (Gmail/Calendar/Stripe). Only on main pushes, the nightly
    # schedule, or manual dispatch — never on PRs from forks (no secret access). The
    # tests themselves also pytest.skip when their creds are absent, so a run without
    # configured secrets is a clean no-op rather than a failure.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: albert
          POSTGRES_PASSWORD: albert
          POSTGRES_DB: albert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albert"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://albert:albert@localhost:5432/albert
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      TOKEN_ENCRYPTION_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      # Secrets are injected as env so the integration conftest can detect + skip when
      # any are missing. Configure these in repo settings to actually exercise them.
      GMAIL_TEST_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Integration tests (skip cleanly without creds)
        run: uv run pytest -m integration
